services:
  mlflow-db-init:
    image: postgres:16
    environment:
      PGPASSWORD: airflow
    entrypoint: /bin/bash
    command: ["-c", "psql -h postgres -U airflow -d airflow -c 'CREATE DATABASE mlflow' || true"]
    depends_on:
      postgres:
        condition: service_healthy
  
  mlflow-ui:
    build: .
    entrypoint: ["mlflow", "ui", "--backend-store-uri", "postgresql+psycopg2://airflow:airflow@postgres/mlflow", "--host", "0.0.0.0"]
    ports:
      - "5000:5000"
    volumes:
      - ../..:/repo
    restart: always
  
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 5s
      retries: 5
    volumes:
      - airflow-postgres:/var/lib/postgresql/data
    restart: always
    ports:
      - "5433:5432"

  # One-shot container: runs DB migrations and creates the admin user.
  # Other services wait for it to complete successfully.
  airflow-init:
    build: .
    environment: &airflow-env
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      # DAG is active immediately after creation — no manual unpause needed.
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "False"
      AIRFLOW__SCHEDULER__DAG_DIR_LIST_INTERVAL: "30"
      AIRFLOW__WEBSERVER__SECRET_KEY: "assignment-secret"
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db migrate
        airflow users create \
          --username admin --password admin \
          --firstname Admin --lastname User \
          --role Admin --email admin@example.com || true
    depends_on:
      postgres:
        condition: service_healthy
      mlflow-db-init:
        condition: service_completed_successfully

  airflow-webserver:
    build: .
    command: webserver
    environment: *airflow-env
    ports:
      - "8080:8080"
    volumes:
      - ./dags:/opt/airflow/dags
      - ./logs:/opt/airflow/logs
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    restart: always

  airflow-scheduler:
    build: .
    command: scheduler
    environment: *airflow-env
    user: "${AIRFLOW_UID:-50000}:0"
    volumes:
      - ./dags:/opt/airflow/dags
      - ./logs:/opt/airflow/logs
      # Repository mounted at /repo: pipeline tasks read/write artifacts
      # directly on the host, so Stage 3 can build them into images.
      - ../..:/repo
      # Host Docker daemon socket: lets the scheduler run `docker compose`
      # commands for Stage 3 deployment.
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    restart: always

volumes:
  airflow-postgres: